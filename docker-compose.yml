version: '3.8'

services:
  # 1. PostgreSQL Database Service
  postgres-db:
    image: postgres:15-alpine
    container_name: pern-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your_db_password
      POSTGRES_DB: printmatrix_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # 2. Express Backend + Built React Frontend
  printmatrix-app:
    build: .
    container_name: pern-app
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      # Connects using the service name 'postgres-db' inside the Docker network
      DATABASE_URL: postgres://postgres:your_db_password@postgres-db:5432/printmatrix_db
    depends_on:
      - postgres-db

volumes:
  pgdata:
