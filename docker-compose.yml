version: '3.8'

services:
  # 1. PostgreSQL Database Service
  postgres-db:
    image: postgres:15-alpine
    container_name: printmatrix-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: yugah5002@
      POSTGRES_DB: printer
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: printmatrix-backend
    restart: always
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres-db
      DB_USER: postgres
      DB_PASSWORD: yugah5002@
      DB_NAME: printer
      DATABASE_URL: postgres://postgres:yugah5002%40@postgres-db:5432/printer
    depends_on:
      - postgres-db

  # 3. React Frontend (Vite/TypeScript)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: printmatrix-frontend
    restart: always
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend

volumes:
  pgdata: